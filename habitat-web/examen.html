<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<script src="/assets/i18n-web.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Exámenes y TP · Habitat</title>
<meta name="description" content="Entrá con tu cuenta del campus para rendir el examen o entregar tu TP.">
<meta name="theme-color" content="#10251d">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="https://static.wixstatic.com/media/43ca3b_2d985f94c5e04a82b1434561cce4cc35~mv2.png">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#10251d;font:16px/1.55 Arial,sans-serif;color:#10251d;padding:16px;box-sizing:border-box}
.c{max-width:520px;width:100%;background:#fbf8f2;border-radius:22px;padding:28px 24px;box-sizing:border-box}
.k{font:700 12px Arial;letter-spacing:.14em;text-transform:uppercase;color:#8a6a35;margin:0 0 8px}
h1{font:600 28px/1.2 Georgia,serif;margin:0 0 12px}
p{margin:0 0 12px}
.b{display:inline-block;background:#10251d;color:#fbf8f2;font:700 15px Arial;padding:12px 20px;border-radius:999px;text-decoration:none;margin:6px 8px 0 0}
.b.s{background:#f1eadc;color:#10251d}
small{color:#5d6b64}
</style>
</head>
<body>
<div class="c" id="c"><p class="k">Habitat CFM · Campus</p><h1>Abriendo el formulario…</h1><p>Un momento, estamos revisando tu cuenta.</p></div>
<script src="/assets/auth.js"></script>
<script>
(async function(){
  var c=document.getElementById('c'),A=window.HabitatAuth,MS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var f=new URLSearchParams(location.search).get('f');
  try{if(f)sessionStorage.setItem('habitat:examen',f);else f=sessionStorage.getItem('habitat:examen');}catch(e){}
  function pinta(t,h){c.innerHTML='<p class="k">Habitat CFM · Campus</p><h1>'+t+'</h1>'+h;}
  if(!f){pinta('No encontramos el formulario','<p>Escaneá de nuevo el código o pedí el link a tu tutor.</p>');return;}
  if(!A||!A.loggedIn()){location.replace('/ingresar.html?ret=/examen.html');return;}
  try{
    await A.api('GET','/members/v1/members/my');
    var tk=JSON.parse(localStorage.getItem('habitat:mtok')).a;
    var r=await fetch('/api/examen?f='+encodeURIComponent(f),{headers:{'x-habitat-auth':tk}});
    var j={};try{j=await r.json();}catch(e){}
    if(r.status===401){location.replace('/ingresar.html?ret=/examen.html');return;}
    if(j.ok&&j.url){try{sessionStorage.removeItem('habitat:examen');}catch(e){}location.replace(j.url);return;}
    if(j.bloqueado){var L=(j.vencidos||[]).map(function(m){return MS[+m.slice(5,7)-1]||m;});var t=L.length>1?L.slice(0,-1).join(', ')+' y '+L[L.length-1]:L.join('');
      pinta('Tu acceso está en pausa','<p>Todavía no registramos el pago de <b>'+L.length+' cuotas</b> ('+t+'). Para rendir exámenes y entregar trabajos prácticos es necesario regularizar tu cuota.</p><p>Apenas se registre el pago, vas a poder entrar con este mismo link. Si ya pagaste, subí el comprobante y lo revisamos.</p><a class="b" href="/campus.html#cuotaSec">💳 Ver mi cuota y pagar</a><p style="margin-top:14px"><small>¿Ves algo que no coincide? Escribinos y lo vemos juntos.</small></p>');return;}
    pinta('No pudimos abrirlo','<p>'+(j.error||'Probá de nuevo en un ratito.')+'</p><a class="b s" href="/campus.html">Ir al campus</a>');
  }catch(e){pinta('No pudimos abrirlo','<p>Revisá tu conexión y probá de nuevo.</p><a class="b s" href="/examen.html">Reintentar</a>');}
})();
</script>
</body>
</html>
