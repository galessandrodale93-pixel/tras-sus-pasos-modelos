<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<script src="/assets/i18n-web.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reportar un problema · Kids &amp; Hero</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#090b1c">
<link rel="icon" type="image/png" href="https://static.wixstatic.com/media/43ca3b_2d985f94c5e04a82b1434561cce4cc35~mv2.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito:wght@500;700;800;900&family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:500 16px/1.5 Nunito,system-ui,sans-serif;color:#EFE6D6;background:#090b1c radial-gradient(120% 60% at 50% 0%,#2a2340 0%,#141228 45%,#090b1c 100%) fixed}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 60px}
.logo{display:block;width:min(260px,70%);margin:6px auto 10px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.5))}
.k{font:800 11px Nunito;letter-spacing:.28em;text-transform:uppercase;color:#E9C37A;text-align:center;margin:0}
h1{font:700 28px/1.15 Cinzel,serif;color:#F3D48A;text-align:center;margin:8px 0 6px}
.lede{font:500 italic 19px/1.4 "Cormorant Garamond",serif;color:#EADFC6;text-align:center;margin:0 0 22px}
form{display:grid;gap:16px}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(233,195,122,.22);border-radius:20px;padding:18px;display:grid;gap:16px;backdrop-filter:blur(6px)}
label{display:grid;gap:7px;font:800 14px Nunito;color:#F3E6C4}
label small{font:600 12.5px Nunito;color:rgba(239,230,214,.65)}
input[type=text],textarea{width:100%;font:600 16px Nunito;color:#fff;background:rgba(9,11,28,.6);border:1px solid rgba(233,195,122,.3);border-radius:14px;padding:12px 14px;outline:none;transition:border-color .2s,box-shadow .2s}
input[type=text]:focus,textarea:focus{border-color:#E9C37A;box-shadow:0 0 0 3px rgba(233,195,122,.18)}
textarea{min-height:130px;resize:vertical}
.chips{display:flex;gap:10px}
.chip{flex:1;position:relative}
.chip input{position:absolute;opacity:0;inset:0}
.chip span{display:grid;place-items:center;gap:2px;padding:12px;border-radius:14px;border:1px solid rgba(233,195,122,.3);background:rgba(9,11,28,.5);font:900 17px Nunito;color:#EFE6D6;cursor:pointer;transition:all .2s}
.chip span small{font:600 12px Nunito;color:rgba(239,230,214,.6)}
.chip input:checked+span{background:linear-gradient(180deg,#F3D48A,#C9953F);color:#1d1406;border-color:#F3D48A}
.chip input:checked+span small{color:#3a2a10}
.chip input:focus-visible+span{box-shadow:0 0 0 3px rgba(233,195,122,.35)}
.shot{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px dashed rgba(233,195,122,.45);background:rgba(9,11,28,.4);cursor:pointer;font:700 15px Nunito;color:#EFE6D6}
.shot input{display:none}
.shot .ic{font-size:24px}
.prev{display:none;position:relative}
.prev img{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:#000}
.prev button{position:absolute;top:8px;right:8px;border:0;border-radius:999px;background:rgba(0,0,0,.65);color:#fff;font:800 13px Nunito;padding:6px 12px;cursor:pointer}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.disp{font:600 12.5px Nunito;color:rgba(239,230,214,.55);text-align:center;margin:0}
.go{border:0;border-radius:16px;padding:16px;font:900 18px Nunito;color:#1d1406;background:linear-gradient(180deg,#F7DC97,#D4A04A);box-shadow:0 12px 30px rgba(212,160,74,.28);cursor:pointer;transition:transform .15s,filter .2s}
.go:active{transform:scale(.98)}
.go[disabled]{filter:grayscale(.6) brightness(.8);cursor:default}
.err{display:none;background:rgba(239,111,97,.14);border:1px solid rgba(239,111,97,.45);color:#FFD0C8;border-radius:14px;padding:10px 14px;font:700 14px Nunito}
.ok{display:none;text-align:center;padding:30px 10px}
.ok .big{font-size:54px}
.ok h2{font:700 24px Cinzel,serif;color:#F3D48A;margin:10px 0 6px}
.ok p{margin:0 0 18px;color:#EADFC6}
.ok button{border:1px solid rgba(233,195,122,.45);background:none;color:#F3E6C4;border-radius:14px;padding:12px 18px;font:800 15px Nunito;cursor:pointer}
.tip{font:600 13px Nunito;color:rgba(239,230,214,.6);text-align:center;margin:18px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="/assets/kh/og-v4.jpg" alt="Kids &amp; Hero" style="border-radius:16px">
  <p class="k">Testers · Tras sus pasos</p>
  <h1>Reportar un problema</h1>
  <p class="lede">¿Algo no anduvo como esperabas? Contanos y lo arreglamos.</p>

  <form id="f" novalidate>
    <div class="card">
      <label>Tu nombre<input type="text" id="nombre" maxlength="80" autocomplete="name" placeholder="Nombre o apodo"></label>
      <div><label style="margin-bottom:7px">¿Qué estabas jugando?</label>
        <div class="chips">
          <label class="chip"><input type="radio" name="rama" value="kids"><span>Kids<small>6 a 11 años</small></span></label>
          <label class="chip"><input type="radio" name="rama" value="hero"><span>Hero<small>12 a 18 años</small></span></label>
        </div>
      </div>
      <label>¿Dónde estabas?<small>El lugar del mapa, la etapa o la pantalla. Por ejemplo: «Belén, misión de la oveja».</small><input type="text" id="donde" maxlength="200" placeholder="Lugar, etapa o pantalla"></label>
      <label>¿Qué pasó?<small>Lo que hiciste justo antes y lo que viste. Cuanto más detalle, más rápido lo encontramos.</small><textarea id="texto" maxlength="3000" placeholder="Por ejemplo: toqué Jugar en el minijuego y la pantalla quedó en negro."></textarea></label>
    </div>
    <div class="card">
      <label class="shot" for="cap"><span class="ic" aria-hidden="true">📸</span><span>Sumar una captura <small style="display:block;font-weight:600;color:rgba(239,230,214,.6)">Opcional, ayuda mucho</small></span><input type="file" id="cap" accept="image/*"></label>
      <div class="prev" id="prev"><img id="prevImg" alt="Captura"><button type="button" id="quitar">Quitar</button></div>
      <label>Tu WhatsApp o mail<small>Opcional, por si necesitamos preguntarte algo.</small><input type="text" id="contacto" maxlength="120" autocomplete="email" placeholder="WhatsApp o mail"></label>
      <div class="hp" aria-hidden="true"><label>Web<input type="text" id="web" tabindex="-1" autocomplete="off"></label></div>
    </div>
    <div class="err" id="err" role="alert"></div>
    <button class="go" id="go" type="submit">Enviar reporte</button>
    <p class="disp" id="disp"></p>
  </form>

  <div class="ok" id="ok" role="status">
    <div class="big" aria-hidden="true">🙌</div>
    <h2>¡Gracias!</h2>
    <p>Recibimos tu reporte. Con cada uno el juego queda mejor.</p>
    <button type="button" id="otro">Reportar otro problema</button>
  </div>
  <p class="tip">Esta página es solo para los testers de Kids &amp; Hero.</p>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var CAP = '';
  function disp() {
    var ua = navigator.userAgent, so = /iPhone|iPad|iPod/.test(ua) ? 'iPhone/iPad' : /Android/.test(ua) ? 'Android' : /Mac OS X/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : 'Otro';
    var nav = /CriOS|Chrome\//.test(ua) && !/Edg\//.test(ua) ? 'Chrome' : /Edg\//.test(ua) ? 'Edge' : /Firefox|FxiOS/.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : 'Otro';
    return so + ' · ' + nav + ' · pantalla ' + screen.width + '×' + screen.height + ' · ' + ua.slice(0, 160);
  }
  $('disp').textContent = 'Se envía también qué aparato usás: ' + disp().split(' · ').slice(0, 3).join(' · ');
  var QR = ''; try { QR = (new URLSearchParams(location.search).get('rama') || '').toLowerCase(); } catch (e) {}
  if (QR === 'kids' || QR === 'hero') { var kk = document.querySelector('.k'); if (kk) kk.textContent = 'Testers · ' + (QR === 'kids' ? 'Kids' : 'Hero') + ' · Tras sus pasos'; }
  try { var r0 = localStorage.getItem('kh:rep:nombre'); if (r0) $('nombre').value = r0; var r1 = localStorage.getItem('kh:rep:rama'); if (r1) { var el = document.querySelector('input[name=rama][value=' + r1 + ']'); if (el) el.checked = true; } } catch (e) {}
  if (QR === 'kids' || QR === 'hero') { var eq = document.querySelector('input[name=rama][value=' + QR + ']'); if (eq) eq.checked = true; }

  $('cap').onchange = function () {
    var f = this.files && this.files[0]; if (!f) return;
    var img = new Image(), url = URL.createObjectURL(f);
    img.onload = function () {
      var M = 1280, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, M / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      var q = .78, d = c.toDataURL('image/jpeg', q);
      while (d.length > 450000 && q > .35) { q -= .12; d = c.toDataURL('image/jpeg', q); }
      CAP = d.length <= 580000 ? d : ''; URL.revokeObjectURL(url);
      if (CAP) { $('prevImg').src = CAP; $('prev').style.display = 'block'; } else { showErr('La captura es muy pesada. Probá con otra.'); }
    };
    img.onerror = function () { showErr('No pudimos abrir esa imagen.'); };
    img.src = url;
  };
  $('quitar').onclick = function () { CAP = ''; $('cap').value = ''; $('prev').style.display = 'none'; };

  function showErr(t) { var e = $('err'); e.textContent = t; e.style.display = t ? 'block' : 'none'; }
  $('f').onsubmit = async function (ev) {
    ev.preventDefault(); showErr('');
    var texto = $('texto').value.trim(), rama = (document.querySelector('input[name=rama]:checked') || {}).value || '';
    if (texto.length < 5) { showErr('Contanos qué pasó, aunque sea en pocas palabras.'); $('texto').focus(); return; }
    var b = $('go'); b.disabled = true; b.textContent = 'Enviando…';
    try {
      localStorage.setItem('kh:rep:nombre', $('nombre').value.trim()); if (rama) localStorage.setItem('kh:rep:rama', rama);
    } catch (e) {}
    try {
      var r = await fetch('/api/kh-reporte', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nombre: $('nombre').value, rama: rama, donde: $('donde').value, texto: texto, contacto: $('contacto').value, captura: CAP, disp: disp(), web: $('web').value }) });
      var j = {}; try { j = await r.json(); } catch (e) {}
      if (!r.ok || !j.ok) throw new Error(j.error || 'No pudimos enviar el reporte.');
      $('f').style.display = 'none'; $('ok').style.display = 'block'; window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) { showErr(e.message || 'No pudimos enviar el reporte. Revisá tu conexión y probá de nuevo.'); }
    b.disabled = false; b.textContent = 'Enviar reporte';
  };
  $('otro').onclick = function () { $('donde').value = ''; $('texto').value = ''; $('contacto').value = $('contacto').value; CAP = ''; $('cap').value = ''; $('prev').style.display = 'none'; $('ok').style.display = 'none'; $('f').style.display = 'grid'; };
})();
</script>
</body>
</html>
