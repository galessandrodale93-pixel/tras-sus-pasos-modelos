name: Servidor de avisos (tsp-avisos)
# Despliega tools/avisos/worker.js. La primera vez crea el espacio KV «tsp-avisos» y la clave VAPID (queda solo como secreto del Worker).
on:
  workflow_dispatch:
jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          cd tools/avisos
          A="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ID=$(curl -s -H "$H" "$A/storage/kv/namespaces?per_page=100" | python3 -c "import sys,json;print(next((n['id'] for n in json.load(sys.stdin)['result'] if n['title']=='tsp-avisos'),''))")
          if [ -z "$ID" ]; then ID=$(curl -s -X POST -H "$H" -H 'Content-Type: application/json' -d '{"title":"tsp-avisos"}' "$A/storage/kv/namespaces" | python3 -c "import sys,json;print(json.load(sys.stdin)['result']['id'])"); echo "KV creado"; fi
          cat > wrangler.toml <<T
          name = "tsp-avisos"
          main = "worker.js"
          compatibility_date = "2026-11-06"
          workers_dev = true
          keep_vars = true
          [[kv_namespaces]]
          binding = "AV"
          id = "$ID"
          [triggers]
          crons = ["0 * * * *"]
          T
          npx -y wrangler@4 deploy
          if ! npx -y wrangler@4 secret list --name tsp-avisos | grep -q VAPID_JWK; then
            node -e "crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign']).then(k=>crypto.subtle.exportKey('jwk',k.privateKey)).then(j=>process.stdout.write(JSON.stringify(j)))" | npx -y wrangler@4 secret put VAPID_JWK --name tsp-avisos
            echo "clave VAPID creada"
          fi
          sleep 5; curl -s https://tsp-avisos.galessandrodale-93.workers.dev/clave | head -c 120; echo
