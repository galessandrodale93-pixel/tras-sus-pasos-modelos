name: Kids & Hero para Windows (kh-windows)
# Arma el instalador (.exe) y la versión portátil del programa de escritorio (carpeta desktop/).
on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar en la web (link fijo de descarga)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/kh-windows.yml"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            desktop
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar
        run: npm install --no-audit --no-fund
      - name: Armar el instalador
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: kids-and-hero-windows
          path: desktop/dist/squirrel-windows/Kids-and-Hero-Windows.exe
          retention-days: 30
      - name: Publicar en el link fijo de descarga
        if: ${{ inputs.publicar }}
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view escritorio -R ${{ github.repository }} >/dev/null 2>&1 || gh release create escritorio -R ${{ github.repository }} --target main --title "Kids & Hero para compu" --notes "Instaladores de Kids & Hero para Windows y Mac. Se descargan desde habitat-cfm.org/kids-hero.html" || sleep 15
          gh release upload escritorio desktop/dist/squirrel-windows/Kids-and-Hero-Windows.exe -R ${{ github.repository }} --clobber
