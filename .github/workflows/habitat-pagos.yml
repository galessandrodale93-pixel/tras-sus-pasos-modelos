# Cada media hora revisa los pagos de Mercado Pago de Habitat (por si el aviso automático de MP no llegó).
# Así un libro o una cuota pagada por transferencia se registra y avisa sin esperar al resumen del día.
name: Pagos Habitat CFM

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Revisar pagos
        run: |
          code=$(curl -sS --retry 2 --retry-delay 20 --max-time 150 -o resp.json -w '%{http_code}' "https://www.habitat-cfm.org/api/mp?revisar=1")
          echo "HTTP $code"; cat resp.json
          [ "$code" = 200 ] || { echo "::error::revisar pagos respondió HTTP $code"; exit 1; }
      - name: Controlar la web (páginas y link de pago)
        if: always()
        run: bash .github/scripts/habitat-chequeo.sh
