name: Kids & Hero para Mac (kh-mac)
# Arma el .dmg del programa de escritorio (carpeta desktop/) para Mac con chip Apple (M1, M2…) e Intel.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/kh-mac.yml"]
jobs:
  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            desktop
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar
        run: npm install --no-audit --no-fund
      - name: Armar el .dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: kids-and-hero-mac
          path: desktop/dist/*.dmg
          retention-days: 30
