# Copia única: baja los archivos de la portada del juego desde su sitio de Wix viejo y los guarda en habitat-juego/src
# (para mudar el juego a habitat-cfm.org). Se dispara sola al subir este archivo.
name: Traer archivos del juego
on:
  push:
    branches: [main]
    paths: ['.github/workflows/traer-juego.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  traer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar
        run: |
          B=https://headless-tjfrhnexbhw-galessandrodale93-1411.wix-site-host.com
          mkdir -p habitat-juego/src
          for f in index.html hero-game.css hero.css hero.js home.css home.js hub.css portal.css portal.js manifest.json tsp-sw.js; do
            curl -fsSL "$B/$f" -o "habitat-juego/src/$f"
          done
          ls -la habitat-juego/src
      - name: Guardar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add habitat-juego/src
          git commit -m "Juego: copia de la portada del sitio viejo para mudarlo a Habitat" || exit 0
          git pull --rebase -q && git push
