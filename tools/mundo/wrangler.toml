name = "tsp-mundo"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true
keep_vars = true

[[durable_objects.bindings]]
name = "MUNDO"
class_name = "Mundo"

[[durable_objects.bindings]]
name = "TRIBUS"
class_name = "Tribus"

[[durable_objects.bindings]]
name = "AMIGOS"
class_name = "Amigos"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mundo"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Tribus"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Amigos"]
